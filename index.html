<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutter Monitoring | Muly@.ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fa;
            color: #2d3748;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card {
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        #reader {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            background-color: #000;
            border: 3px solid #ebf1f9;
        }
        /* Menyembunyikan kontrol bawaan library yang mengganggu */
        #reader__dashboard_section_csr button { display: none !important; }
        #reader__status_span { display: none !important; }
        #reader video { object-fit: cover !important; }
        
        .tab-active {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .tab-inactive {
            color: #718096;
        }
        .status-pulse {
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="antialiased pb-12">

    <div class="max-w-md mx-auto p-4 space-y-5">
        
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tighter">Muly@.ID</h1>
                <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Cutter Monitoring System</p>
            </div>
            <div class="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-full border border-gray-100 shadow-sm">
                <div class="w-2 h-2 bg-green-500 rounded-full status-pulse"></div>
                <span id="systemStatus" class="text-[9px] font-black text-gray-600 uppercase">System Live</span>
            </div>
        </header>

        <div id="cameraContainer" class="hidden transition-all duration-300">
            <div class="app-card p-3 border-2 border-blue-500 shadow-2xl">
                <div id="reader"></div>
                <div class="flex flex-col gap-2 mt-3">
                    <p class="text-[9px] text-center text-gray-400 font-bold uppercase">Mencoba Mengunci Fokus Otomatis...</p>
                    <button onclick="stopCamera()" class="w-full py-3 bg-red-50 text-red-600 font-bold text-xs rounded-xl hover:bg-red-100 transition">
                        BATALKAN PEMINDAIAN
                    </button>
                </div>
            </div>
        </div>

        <div id="formSection" class="app-card p-6 space-y-6">
            
            <div class="flex bg-gray-100 p-1.5 rounded-2xl">
                <button id="modePinjam" onclick="setMode('PINJAM')" class="flex-1 py-3 text-xs font-black rounded-xl transition-all tab-active uppercase">
                    Pinjam
                </button>
                <button id="modeKembali" onclick="setMode('KEMBALI')" class="flex-1 py-3 text-xs font-black rounded-xl transition-all tab-inactive uppercase">
                    Kembali
                </button>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">ID Unit Cutter</label>
                    <div class="relative flex items-center">
                        <input type="text" id="assetIdInput" readonly 
                               class="w-full bg-gray-50 border border-gray-100 p-4 pr-16 rounded-2xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm" 
                               placeholder="Scan QR Unit...">
                        <button onclick="startCamera()" class="absolute right-2 p-2.5 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-200 active:scale-90 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button id="submitBtn" onclick="submitData()" 
                        class="w-full py-4 bg-gray-900 text-white font-black text-sm rounded-2xl shadow-xl shadow-gray-200 hover:bg-blue-700 transition duration-300 active:scale-[0.97]">
                    SIMPAN DATA KE DRIVE
                </button>
            </div>
        </div>

        <div class="app-card overflow-hidden">
            <div class="px-6 py-5 border-b border-gray-50 bg-gray-50/50 flex justify-between items-center">
                <div>
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest">Daftar Pinjaman</h3>
                    <p class="text-[9px] text-gray-400 font-medium">Auto-sync aktif</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="outBadge" class="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full border border-blue-100">0 UNIT OUT</span>
                </div>
            </div>
            
            <div class="max-h-80 overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-[9px] font-black text-gray-400 uppercase border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-3">ID Asset / Unit</th>
                            <th class="px-6 py-3 text-right">Waktu Pinjam</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-gray-50">
                        <tr>
                            <td colspan="2" class="px-6 py-10 text-center text-gray-400 text-xs font-medium italic">
                                Menghubungkan ke Sheets...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        /**
         * PENTING: Ganti URL ini dengan URL Web App Deployment terbaru Anda
         */
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxERurz5XLHHI630eGb7ixMkulJ3lFMk0kOxRNlBTJu2FHBmGqmFMlljmo-0scqq88B/exec";
        
        let currentMode = "PINJAM";
        let html5QrCode = null;

        /**
         * 📷 LOGIKA KAMERA DENGAN AUTO FOCUS OPTIMIZATION
         */
        async function startCamera() {
            const container = document.getElementById('cameraContainer');
            const form = document.getElementById('formSection');
            
            container.classList.remove('hidden');
            form.classList.add('opacity-20', 'pointer-events-none');
            
            if (html5QrCode) {
                try { await html5QrCode.clear(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            
            // Konfigurasi Constraints Tingkat Lanjut untuk Fokus & Ketajaman
            const config = { 
                fps: 25, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                videoConstraints: {
                    facingMode: "environment",
                    // Meminta resolusi tinggi agar sensor fokus bekerja lebih baik
                    width: { min: 640, ideal: 1280, max: 1920 },
                    height: { min: 640, ideal: 720, max: 1080 },
                    // Mencoba memaksa mode fokus berkelanjutan
                    focusMode: "continuous",
                    whiteBalance: "continuous"
                }
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        document.getElementById('assetIdInput').value = decodedText.toUpperCase().trim();
                        if (navigator.vibrate) navigator.vibrate(70);
                        stopCamera();
                    }
                ).then(() => {
                    // SETELAH KAMERA AKTIF: Paksa Hardware untuk Fokus (Jika didukung browser)
                    applyAutoFocus();
                });
            } catch (err) {
                console.error(err);
                alert("Gagal akses kamera. Pastikan menggunakan HTTPS dan memberi izin kamera.");
                stopCamera();
            }
        }

        /**
         * 🛠️ Fungsi Tambahan untuk Memaksa Fokus ke Hardware
         */
        function applyAutoFocus() {
            const videoTrack = document.querySelector("#reader video");
            if (videoTrack && videoTrack.srcObject) {
                const track = videoTrack.srcObject.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                
                // Jika hardware mendukung perintah fokus via JS
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    track.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    }).catch(e => console.log("Focus constraint failed", e));
                }
            }
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('cameraContainer').classList.add('hidden');
                    document.getElementById('formSection').classList.remove('opacity-20', 'pointer-events-none');
                }).catch(() => {
                    document.getElementById('cameraContainer').classList.add('hidden');
                    document.getElementById('formSection').classList.remove('opacity-20', 'pointer-events-none');
                });
            }
        }

        /**
         * 💾 KIRIM DATA
         */
        async function submitData() {
            const assetId = document.getElementById('assetIdInput').value;
            const btn = document.getElementById('submitBtn');

            if (!assetId) {
                alert("Scan unit dulu!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span>MENYIMPAN...</span>`;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify({
                        assetId: assetId,
                        statusAksi: currentMode
                    })
                });

                document.getElementById('assetIdInput').value = "";
                if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
                
                // Jeda 2 detik agar Sheets selesai memproses sebelum tabel ditarik
                setTimeout(syncData, 2000);

            } catch (err) {
                alert("Koneksi gagal.");
            } finally {
                btn.disabled = false;
                btn.innerText = "SIMPAN DATA KE DRIVE";
            }
        }

        /**
         * 📊 UPDATE TABEL
         */
        async function syncData() {
            const tbody = document.getElementById('dataTableBody');
            const badge = document.getElementById('outBadge');
            
            try {
                const response = await fetch(SCRIPT_URL + "?action=getdata");
                const res = await response.json();
                
                badge.innerText = `${res.stats.out} UNIT OUT`;

                if (!res.listDipinjam || res.listDipinjam.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="2" class="px-6 py-12 text-center text-gray-400 text-[10px] font-bold uppercase italic">
                                Semua cutter berada di rak
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = res.listDipinjam.map(item => `
                    <tr class="hover:bg-blue-50 transition duration-150">
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="text-sm font-black text-gray-900 tracking-tight">${item.id}</span>
                                <span class="text-[9px] font-bold text-gray-400 uppercase">PIC: ${item.user || 'SYSTEM'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex flex-col">
                                <span class="text-xs font-black text-gray-700">${item.waktu.split(' ')[1]}</span>
                                <span class="text-[9px] font-bold text-gray-400">${item.waktu.split(' ')[0]}</span>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.log("Sync error");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnP = document.getElementById('modePinjam');
            const btnK = document.getElementById('modeKembali');

            if (mode === 'PINJAM') {
                btnP.className = "flex-1 py-3 text-xs font-black rounded-xl transition-all tab-active uppercase";
                btnK.className = "flex-1 py-3 text-xs font-black rounded-xl transition-all tab-inactive uppercase";
            } else {
                btnK.className = "flex-1 py-3 text-xs font-black rounded-xl transition-all bg-green-600 text-white shadow-lg uppercase";
                btnP.className = "flex-1 py-3 text-xs font-black rounded-xl transition-all tab-inactive uppercase";
            }
        }

        window.onload = syncData;
        setInterval(syncData, 15000);
    </script>
</body>
</html>
