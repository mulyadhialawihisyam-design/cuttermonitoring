<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutter Monitoring System | Muly@.ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #reader {
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            background-color: #000;
        }
        /* Memperbaiki tampilan tombol internal scanner agar tidak mengganggu */
        #reader__dashboard_section_csr button {
            display: none !important;
        }
        #reader video {
            border-radius: 0.75rem;
            object-fit: cover;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4 pb-10">
        
        <header class="flex justify-between items-center mb-6 py-2">
            <div>
                <h1 class="text-xl font-bold text-gray-900 text-blue-600">Cutter Tracker</h1>
                <p class="text-xs text-gray-500 font-medium tracking-wide">LOGISTICS OPS MONITORING</p>
            </div>
            <div class="flex items-center bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                <span class="status-dot pulse"></span>
                <span id="statusText" class="text-[10px] font-bold text-gray-600 uppercase tracking-tight">System Ready</span>
            </div>
        </header>

        <div id="cameraArea" class="hidden mb-6 transition-all duration-300">
            <div class="app-card p-3 border-2 border-blue-500">
                <div id="reader"></div>
                <div class="mt-3 flex gap-2">
                    <button onclick="stopCamera()" class="flex-1 py-3 bg-red-100 text-red-600 font-bold text-sm rounded-xl">
                        BATALKAN
                    </button>
                </div>
            </div>
        </div>

        <div id="mainContent" class="space-y-4">
            
            <div class="app-card p-1.5 flex bg-gray-200">
                <button id="tabPinjam" onclick="setMode('PINJAM')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md">
                    PINJAM
                </button>
                <button id="tabKembali" onclick="setMode('KEMBALI')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-gray-600">
                    KEMBALI
                </button>
            </div>

            <div class="app-card p-6 space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">LOKASI / ZONA</label>
                    <div class="relative">
                        <input type="text" id="zonaDisplay" readonly 
                               class="w-full bg-gray-50 border border-gray-200 p-4 pr-14 text-gray-900 rounded-xl font-bold focus:outline-none text-sm" 
                               placeholder="Scan Lokasi...">
                        <button onclick="startCamera('ZONA')" class="absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-lg shadow-lg active:scale-95 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">ID UNIT CUTTER</label>
                    <div class="relative">
                        <input type="text" id="assetDisplay" readonly 
                               class="w-full bg-gray-50 border border-gray-200 p-4 pr-14 text-gray-900 rounded-xl font-bold focus:outline-none text-sm" 
                               placeholder="Scan Unit...">
                        <button onclick="startCamera('ASSET')" class="absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-lg shadow-lg active:scale-95 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button id="submitBtn" onclick="submitData()" class="w-full py-4 bg-gray-900 text-white font-black text-sm rounded-2xl shadow-xl hover:bg-blue-700 transition duration-300">
                    SIMPAN KE DATABASE
                </button>
            </div>

            <div class="app-card overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest">Unit Dipinjam</h3>
                    <span id="statOut" class="bg-orange-100 text-orange-600 text-[10px] px-2 py-0.5 rounded-full font-bold">0 OUT</span>
                </div>
                <div class="max-h-64 overflow-y-auto">
                    <table class="w-full text-left text-sm">
                        <tbody id="assetTable" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxERurz5XLHHI630eGb7ixMkulJ3lFMk0kOxRNlBTJu2FHBmGqmFMlljmo-0scqq88B/exec";
        let currentMode = "PINJAM";
        let isProcessing = false;
        let html5QrCode;
        let scanTarget = "";

        /**
         * FUNGSI KAMERA (Optimized for Speed)
         */
        async function startCamera(target) {
            scanTarget = target;
            
            // UI Feedback
            document.getElementById('statusText').innerText = "Inisialisasi...";
            document.getElementById('cameraArea').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('opacity-30', 'pointer-events-none');

            // Hancurkan instance lama jika ada (mencegah memory leak/delay)
            if (html5QrCode) {
                try { await html5QrCode.clear(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            
            // Konfigurasi performa tinggi
            const config = { 
                fps: 25, // Frame per second lebih tinggi agar lebih responsif
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true // Gunakan deteksi hardware jika ada
                }
            };

            try {
                // Memaksa browser menggunakan kamera belakang (environment) secara langsung
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess
                );
                document.getElementById('statusText').innerText = "Scanner Aktif";
            } catch (err) {
                console.error("Gagal start kamera:", err);
                alert("Kamera Error. Pastikan Anda klik 'Allow' pada izin browser.");
                stopCamera();
            }
        }

        function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('cameraArea').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('opacity-30', 'pointer-events-none');
                    document.getElementById('statusText').innerText = "System Ready";
                }).catch(err => console.error("Gagal stop:", err));
            } else {
                document.getElementById('cameraArea').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('opacity-30', 'pointer-events-none');
            }
        }

        function onScanSuccess(decodedText) {
            const result = decodedText.toUpperCase().trim();
            vibrate(70);

            if (scanTarget === "ZONA") {
                document.getElementById('zonaDisplay').value = result;
            } else {
                document.getElementById('assetDisplay').value = result;
            }
            
            stopCamera();
        }

        /**
         * FUNGSI DATA & DATABASE
         */
        async function submitData() {
            const zona = document.getElementById('zonaDisplay').value;
            const asset = document.getElementById('assetDisplay').value;

            if (!zona || !asset) {
                alert("Data belum lengkap. Silakan scan Zona dan Unit.");
                return;
            }

            isProcessing = true;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Sedang Menyimpan...";
            document.getElementById('statusText').innerText = "Sync Database...";

            try {
                // Kirim ke Apps Script
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify({
                        assetId: asset,
                        zonaId: zona,
                        statusAksi: currentMode,
                        user: "PIC_FIELD"
                    })
                });

                // Reset field asset setelah sukses
                document.getElementById('assetDisplay').value = "";
                document.getElementById('statusText').innerText = "Data Tersimpan!";
                vibrate([50, 50, 50]);
                
                // Refresh Tabel
                syncData();
            } catch (err) {
                alert("Koneksi gagal. Cek internet Anda.");
            } finally {
                isProcessing = false;
                btn.disabled = false;
                btn.innerText = "SIMPAN KE DATABASE";
            }
        }

        async function syncData() {
            if (isProcessing) return;
            try {
                const response = await fetch(API_URL);
                const res = await response.json();
                
                document.getElementById('statOut').innerText = res.stats.out + " OUT";

                const tbody = document.getElementById('assetTable');
                if (res.listDipinjam.length === 0) {
                    tbody.innerHTML = `<tr><td class="px-5 py-10 text-center text-gray-400 font-medium">Kosong</td></tr>`;
                } else {
                    tbody.innerHTML = res.listDipinjam.map(item => `
                        <tr class="hover:bg-gray-50">
                            <td class="px-5 py-4">
                                <p class="font-bold text-gray-900">${item.id}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">${item.zona}</p>
                            </td>
                            <td class="px-5 py-4 text-right">
                                <p class="text-[10px] font-bold text-gray-900">${item.waktu.split(' ')[1]}</p>
                                <p class="text-[9px] text-gray-400">${item.waktu.split(' ')[0]}</p>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error("Gagal update tabel:", e);
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const tP = document.getElementById('tabPinjam');
            const tK = document.getElementById('tabKembali');

            if (mode === 'PINJAM') {
                tP.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-blue-600 text-white shadow-md";
                tK.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-600";
            } else {
                tK.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-green-600 text-white shadow-md";
                tP.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-600";
            }
        }

        function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

        // Sinkronisasi otomatis setiap 10 detik
        setInterval(syncData, 10000);
        window.onload = syncData;
    </script>
</body>
</html>
