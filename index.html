<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutter Monitoring System | Muly@.ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #reader {
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            background-color: #000;
        }
        /* Menghilangkan tombol internal library */
        #reader__dashboard_section_csr button {
            display: none !important;
        }
        #reader video {
            border-radius: 0.75rem;
            object-fit: cover;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        /* Style scrollbar agar lebih cantik */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4 pb-10">
        
        <header class="flex justify-between items-center mb-6 py-2">
            <div>
                <h1 class="text-xl font-bold text-blue-600 tracking-tight">Cutter Tracker</h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Muly@.ID Monitoring</p>
            </div>
            <div class="flex items-center bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                <span class="status-dot pulse"></span>
                <span id="statusText" class="text-[10px] font-bold text-gray-600 uppercase tracking-tight">System Ready</span>
            </div>
        </header>

        <div id="cameraArea" class="hidden mb-6 transition-all duration-300">
            <div class="app-card p-3 border-2 border-blue-500 shadow-2xl">
                <div id="reader"></div>
                <div class="mt-3">
                    <button onclick="stopCamera()" class="w-full py-3 bg-red-50 text-red-600 font-bold text-sm rounded-xl hover:bg-red-100 transition">
                        BATALKAN SCAN
                    </button>
                </div>
            </div>
        </div>

        <div id="mainContent" class="space-y-4">
            
            <div class="app-card p-1.5 flex bg-gray-200">
                <button id="tabPinjam" onclick="setMode('PINJAM')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md">
                    PINJAM
                </button>
                <button id="tabKembali" onclick="setMode('KEMBALI')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-gray-600">
                    KEMBALI
                </button>
            </div>

            <div class="app-card p-6 space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest flex justify-between">
                        <span>LOKASI / ZONA</span>
                        <span id="zonaStatus" class="text-blue-500 hidden font-bold italic">Terkunci</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="zonaDisplay" readonly 
                               class="w-full bg-gray-50 border border-gray-200 p-4 pr-14 text-gray-900 rounded-xl font-bold focus:outline-none text-sm" 
                               placeholder="Tap icon kamera untuk scan...">
                        <button onclick="startCamera('ZONA')" class="absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-lg shadow-lg active:scale-95 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">ID UNIT CUTTER</label>
                    <div class="relative">
                        <input type="text" id="assetDisplay" readonly 
                               class="w-full bg-gray-50 border border-gray-200 p-4 pr-14 text-gray-900 rounded-xl font-bold focus:outline-none text-sm" 
                               placeholder="Scan ID Cutter...">
                        <button onclick="startCamera('ASSET')" class="absolute right-2 top-2 p-2 bg-blue-600 text-white rounded-lg shadow-lg active:scale-95 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button id="submitBtn" onclick="submitData()" class="w-full py-4 bg-gray-900 text-white font-black text-sm rounded-2xl shadow-xl hover:bg-blue-700 transition duration-300 active:scale-[0.98]">
                    SIMPAN & UPDATE TABEL
                </button>
            </div>

            <div class="app-card overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Cutter Sedang Dipinjam</h3>
                    <span id="outBadge" class="bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold">0 UNIT</span>
                </div>
                <div class="max-h-72 overflow-y-auto custom-scroll">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-[9px] font-bold text-gray-400 uppercase border-b border-gray-100">
                            <tr>
                                <th class="px-5 py-3">ID Pinjam</th>
                                <th class="px-5 py-3 text-center">Zona</th>
                                <th class="px-5 py-3 text-right">Waktu</th>
                            </tr>
                        </thead>
                        <tbody id="assetTable" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API URL Pastikan menggunakan URL Exec terbaru
        const API_URL = "https://script.google.com/macros/s/AKfycbxERurz5XLHHI630eGb7ixMkulJ3lFMk0kOxRNlBTJu2FHBmGqmFMlljmo-0scqq88B/exec";
        
        let currentMode = "PINJAM";
        let isProcessing = false;
        let html5QrCode;
        let scanTarget = "";

        /** * 1. LOGIKA KAMERA 
         */
        async function startCamera(target) {
            scanTarget = target;
            document.getElementById('statusText').innerText = "Membuka Kamera...";
            document.getElementById('cameraArea').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('opacity-20', 'pointer-events-none');

            if (html5QrCode) {
                try { await html5QrCode.clear(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 20, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0 
            };

            try {
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
                document.getElementById('statusText').innerText = "Scanner Aktif";
            } catch (err) {
                alert("Izin kamera ditolak atau tidak ditemukan.");
                stopCamera();
            }
        }

        function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('cameraArea').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('opacity-20', 'pointer-events-none');
                    document.getElementById('statusText').innerText = "System Ready";
                }).catch(err => console.log(err));
            } else {
                document.getElementById('cameraArea').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('opacity-20', 'pointer-events-none');
            }
        }

        function onScanSuccess(decodedText) {
            const result = decodedText.toUpperCase().trim();
            vibrate(60);
            
            if (scanTarget === "ZONA") {
                document.getElementById('zonaDisplay').value = result;
                document.getElementById('zonaStatus').classList.remove('hidden');
            } else {
                document.getElementById('assetDisplay').value = result;
            }
            stopCamera();
        }

        /** * 2. LOGIKA KIRIM DATA (SUBMIT) 
         */
        async function submitData() {
            const zona = document.getElementById('zonaDisplay').value;
            const asset = document.getElementById('assetDisplay').value;

            if (!zona || !asset) {
                alert("Scan ZONA dan UNIT terlebih dahulu!");
                return;
            }

            isProcessing = true;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "SINKRONISASI DRIVE...";
            document.getElementById('statusText').innerText = "Mengirim...";

            try {
                // Proses pengiriman ke Google Sheets Drive
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify({
                        assetId: asset,
                        zonaId: zona,
                        statusAksi: currentMode,
                        user: "PIC_FIELD"
                    })
                });

                // Reset field asset agar bisa scan asset lain tanpa hapus zona
                document.getElementById('assetDisplay').value = "";
                document.getElementById('statusText').innerText = "Tersimpan!";
                vibrate([50, 100, 50]);
                
                // Segera update tabel setelah kirim
                setTimeout(syncData, 1500); 

            } catch (err) {
                alert("Error: Gagal terhubung ke Database.");
            } finally {
                isProcessing = false;
                btn.disabled = false;
                btn.innerText = "SIMPAN & UPDATE TABEL";
            }
        }

        /** * 3. LOGIKA UPDATE TABEL (VIEW DATA)
         */
        async function syncData() {
            if (isProcessing) return;
            
            try {
                // Fetch data dari API (doGet di Apps Script)
                const response = await fetch(API_URL);
                const res = await response.json();
                
                // Update Badge Angka
                document.getElementById('outBadge').innerText = res.stats.out + " UNIT";

                const tbody = document.getElementById('assetTable');
                
                // Jika tidak ada data yang dipinjam
                if (!res.listDipinjam || res.listDipinjam.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="px-5 py-10 text-center text-gray-400 text-xs font-medium italic">Semua cutter berada di base / Tersedia</td></tr>`;
                    return;
                }

                // Render baris tabel
                tbody.innerHTML = res.listDipinjam.map(item => {
                    // Memisahkan Waktu (Dibuat lebih rapi)
                    // Asumsi item.waktu berformat "08/05/2026 09:15:00" atau sejenisnya
                    const timePart = item.waktu.split(' ');
                    const tanggal = timePart[0] || "";
                    const jam = timePart[1] ? timePart[1].substring(0, 5) : ""; // Ambil HH:mm saja

                    return `
                        <tr class="hover:bg-blue-50 transition duration-150">
                            <td class="px-5 py-4">
                                <p class="text-sm font-bold text-gray-900 tracking-tight">${item.id}</p>
                                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">${item.user || 'PIC_FIELD'}</p>
                            </td>
                            <td class="px-5 py-4 text-center">
                                <span class="bg-blue-50 text-blue-600 text-[10px] font-black px-2 py-1 rounded border border-blue-100 uppercase">
                                    ${item.zona}
                                </span>
                            </td>
                            <td class="px-5 py-4 text-right">
                                <p class="text-xs font-bold text-gray-800">${jam}</p>
                                <p class="text-[9px] text-gray-400">${tanggal}</p>
                            </td>
                        </tr>
                    `;
                }).join('');

                console.log("Sync Success: Table Updated");
            } catch (e) {
                console.error("Gagal sinkronisasi tabel:", e);
            }
        }

        /** * 4. FUNGSI PENDUKUNG (UI UTILS) 
         */
        function setMode(mode) {
            currentMode = mode;
            const tP = document.getElementById('tabPinjam');
            const tK = document.getElementById('tabKembali');

            if (mode === 'PINJAM') {
                tP.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-blue-600 text-white shadow-md";
                tK.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-600";
            } else {
                tK.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-green-600 text-white shadow-md";
                tP.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-600";
            }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // Auto Sync setiap 10 detik agar tetap up-to-date
        setInterval(syncData, 10000);
        
        // Jalankan sinkronisasi pertama kali saat halaman dimuat
        window.onload = syncData;
    </script>
</body>
</html>
