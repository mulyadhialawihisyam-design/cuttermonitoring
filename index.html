<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Cutter Tracker Premium | Muly@.ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ===== BASE THEMES ===== */
        :root {
            --bg-deep: #06120f;
            --bg-panel: #0c1d17;
            --bg-panel-soft: #102822;
            --border-soft: #1f3d33;
            --accent: #2dd4a7;
            --accent-soft: #58e0bd;
            --accent-gold: #d9b95c;
            --text-main: #eafff5;
            --text-dim: #6f9c8d;
            --pinjam-from: #2dd4a7;
            --pinjam-to: #58e0bd;
            --pinjam-shadow: rgba(45,212,167,0.4);
            --kembali-from: #f97316;
            --kembali-to: #fb923c;
            --kembali-shadow: rgba(249,115,22,0.4);
        }

        /* THEME: VIOLET */
        [data-theme="violet"] {
            --bg-deep: #07050f;
            --bg-panel: #110d1e;
            --bg-panel-soft: #1a1230;
            --border-soft: #2e1f55;
            --accent: #a78bfa;
            --accent-soft: #c4b5fd;
            --accent-gold: #f0abfc;
            --text-main: #f0ebff;
            --text-dim: #7c6fa0;
            --pinjam-from: #7c3aed;
            --pinjam-to: #a78bfa;
            --pinjam-shadow: rgba(124,58,237,0.45);
            --kembali-from: #ec4899;
            --kembali-to: #f9a8d4;
            --kembali-shadow: rgba(236,72,153,0.45);
        }

        /* THEME: AMBER */
        [data-theme="amber"] {
            --bg-deep: #0f0900;
            --bg-panel: #1a1000;
            --bg-panel-soft: #261800;
            --border-soft: #4a3100;
            --accent: #f59e0b;
            --accent-soft: #fcd34d;
            --accent-gold: #fb923c;
            --text-main: #fffbeb;
            --text-dim: #92743a;
            --pinjam-from: #d97706;
            --pinjam-to: #fbbf24;
            --pinjam-shadow: rgba(217,119,6,0.45);
            --kembali-from: #dc2626;
            --kembali-to: #f87171;
            --kembali-shadow: rgba(220,38,38,0.45);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--bg-panel) 80%, transparent) 0%, var(--bg-deep) 55%, #040907 100%);
            color: var(--accent-gold);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .luxury-card {
            background: linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-deep) 100%);
            border: 1px solid var(--border-soft);
            border-radius: 1.5rem;
            box-shadow: 0 10px 35px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 45%, var(--accent-gold) 100%);
            color: #04140f;
            box-shadow: 0 8px 20px var(--pinjam-shadow);
        }
        #reader {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid var(--accent);
        }
        #reader__dashboard_section_csr button { display: none !important; }
        #reader video { object-fit: cover !important; }

        /* ===== PINJAM / KEMBALI TABS ===== */
        .tab-pinjam-active {
            background: linear-gradient(135deg, var(--pinjam-from) 0%, var(--pinjam-to) 100%);
            color: #04140f;
            font-weight: 900;
            box-shadow: 0 5px 18px var(--pinjam-shadow);
            transform: scale(1.02);
            border: none;
        }
        .tab-kembali-active {
            background: linear-gradient(135deg, var(--kembali-from) 0%, var(--kembali-to) 100%);
            color: #fff;
            font-weight: 900;
            box-shadow: 0 5px 18px var(--kembali-shadow);
            transform: scale(1.02);
            border: none;
        }
        .tab-inactive {
            color: var(--text-dim);
            border: 1px solid var(--border-soft);
            background: rgba(255,255,255,0.01);
            transform: scale(1);
        }
        .tab-inactive:hover {
            background: rgba(255,255,255,0.04);
        }

        .gold-solid { color: var(--accent-gold); }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .notif-alert { animation: slideIn 0.3s ease-out forwards; }

        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        #searchInput { min-height: 45px; transition: all 0.3s ease; }
        #searchInput:focus { min-height: 80px; }

        .row-stale { box-shadow: inset 3px 0 0 0 #e0584f; }
        .row-warn  { box-shadow: inset 3px 0 0 0 var(--accent-gold); }
        .row-fresh { box-shadow: inset 3px 0 0 0 var(--accent); }

        .pill-glow {
            background: rgba(45,212,167,0.08);
            border: 1px solid rgba(45,212,167,0.35);
        }
        [data-theme="violet"] .pill-glow {
            background: rgba(167,139,250,0.08);
            border: 1px solid rgba(167,139,250,0.35);
        }
        [data-theme="amber"] .pill-glow {
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.35);
        }

        /* ===== THEME SWITCHER ===== */
        .theme-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .theme-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .theme-btn:hover { transform: scale(1.15); }
        .theme-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
            transform: scale(1.1);
        }
        .theme-btn.active::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }
        .theme-green  { background: linear-gradient(135deg, #2dd4a7, #d9b95c); }
        .theme-violet { background: linear-gradient(135deg, #7c3aed, #ec4899); }
        .theme-amber  { background: linear-gradient(135deg, #d97706, #dc2626); }

        /* ===== HEADER MASCOT ===== */
        .header-mascot {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mascot-img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--accent));
            transition: filter 0.4s ease;
            animation: floatMascot 3s ease-in-out infinite;
        }
        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .mascot-tagline {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mascot-tagline .brand {
            font-size: 9px;
            font-weight: 900;
            color: var(--text-dim);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .mascot-tagline .slogan {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-soft);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .mascot-tagline .slogan span {
            color: var(--accent-gold);
        }

        /* theme transition */
        body, .luxury-card, .btn-gold, .tab-pinjam-active, .tab-kembali-active {
            transition: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }
    </style>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxERurz5XLHHI630eGb7ixMkulJ3lFMk0kOxRNlBTJu2FHBmGqmFMlljmo-0scqq88B/exec";
        let currentMode = "PINJAM";
        let html5QrCode = null;

        // ===== THEME SWITCHER =====
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            ['green','violet','amber'].forEach(t => {
                document.getElementById('btn-' + t).classList.toggle('active', t === theme);
            });
            localStorage.setItem('ct_theme', theme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('ct_theme') || 'green';
        setTheme(savedTheme);

        // ===== SMART SEARCH =====
        function filterTable() {
            const input = document.getElementById("searchInput");
            const rawValue = input.value.trim();
            const alertBox = document.getElementById("notFoundAlert");
            const alertText = document.getElementById("notFoundText");

            if (!rawValue) {
                resetTable();
                alertBox.classList.add('hidden');
                return;
            }

            let lines = rawValue.split(/\n|,/);
            let searchKeys = lines.map(line => {
                let clean = line.trim().split(/\s+/)[0];
                return clean.toUpperCase();
            }).filter(k => k !== "");

            const tr = document.getElementById("mainTable").getElementsByTagName("tr");
            let foundKeys = new Set();

            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    const cellContent = td.textContent || td.innerText;
                    const cellUpper = cellContent.toUpperCase();
                    let isMatch = false;
                    searchKeys.forEach(key => {
                        if (cellUpper.indexOf(key) > -1) {
                            isMatch = true;
                            foundKeys.add(key);
                        }
                    });
                    tr[i].style.display = isMatch ? "" : "none";
                }
            }

            const missing = searchKeys.filter(key => !foundKeys.has(key));
            if (missing.length > 0) {
                alertBox.classList.remove('hidden');
                alertText.innerText = missing.join(' | ');
            } else {
                alertBox.classList.add('hidden');
            }
        }

        function resetTable() {
            const tr = document.getElementById("mainTable").getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) tr[i].style.display = "";
        }

        // ===== SCANNER =====
        async function startCamera() {
            const container = document.getElementById('cameraContainer');
            container.classList.remove('hidden');
            if (html5QrCode) { try { await html5QrCode.clear(); } catch(e) {} }
            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 20,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            };

            try {
                await html5QrCode.start({ facingMode: "environment" }, config, (txt) => {
                    document.getElementById('assetIdInput').value = txt.toUpperCase().trim();
                    if (navigator.vibrate) navigator.vibrate(80);
                    stopCamera();
                });
            } catch (err) { stopCamera(); }
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('cameraContainer').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('cameraContainer').classList.add('hidden');
                });
            }
        }

        // ===== SUBMIT =====
        async function submitData() {
            const assetId = document.getElementById('assetIdInput').value;
            const btn = document.getElementById('submitBtn');
            if (!assetId) return alert("Scan QR Terlebih Dahulu!");

            btn.disabled = true;
            btn.innerText = "SINKRONISASI...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ assetId: assetId, statusAksi: currentMode })
                });
                document.getElementById('assetIdInput').value = "";
                setTimeout(syncData, 1500);
            } catch (err) { alert("Cloud Error."); }
            finally { btn.disabled = false; btn.innerText = "SIMPAN KE CLOUD DATABASE"; }
        }

        // ===== PARSE WAKTU =====
        function parseWaktu(item) {
            if (item.waktuIso) return new Date(item.waktuIso);
            const str = item.waktu;
            const [datePart, timePart] = str.split(' ');
            const [dd, mm] = datePart.split('/').map(Number);
            const [HH, MM] = timePart.split(':').map(Number);
            const now = new Date();
            let year = now.getFullYear();
            let d = new Date(year, mm - 1, dd, HH, MM);
            if (d.getTime() - now.getTime() > 24 * 60 * 60 * 1000) {
                d = new Date(year - 1, mm - 1, dd, HH, MM);
            }
            return d;
        }

        function formatDurasi(ms) {
            const totalMinutes = Math.floor(ms / 60000);
            const days = Math.floor(totalMinutes / 1440);
            const hours = Math.floor((totalMinutes % 1440) / 60);
            const minutes = totalMinutes % 60;
            if (days > 0) return `${days}h ${hours}j`;
            if (hours > 0) return `${hours}j ${minutes}m`;
            return `${minutes}m`;
        }

        // ===== FETCH DATA =====
        async function syncData() {
            const tbody = document.getElementById('dataTableBody');
            try {
                const response = await fetch(SCRIPT_URL + "?action=getdata");
                const res = await response.json();
                document.getElementById('outBadge').innerText = `${res.stats.out} UNIT OUT`;

                if (!res.listDipinjam || res.listDipinjam.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="2" class="px-6 py-12 text-center text-[9px] font-black uppercase tracking-widest italic" style="color:var(--text-dim);">Inventory Safe</td></tr>`;
                    return;
                }

                const now = new Date();
                const sorted = res.listDipinjam
                    .map(item => ({ ...item, parsedDate: parseWaktu(item) }))
                    .sort((a, b) => a.parsedDate - b.parsedDate);

                tbody.innerHTML = sorted.map(item => {
                    const diffMs = now - item.parsedDate;
                    const diffHours = diffMs / 3600000;
                    let rowClass = 'row-fresh';
                    if (diffHours >= 24) rowClass = 'row-stale';
                    else if (diffHours >= 8) rowClass = 'row-warn';

                    return `
                    <tr class="hover:bg-white/5 transition ${rowClass}">
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="text-[11px] font-black text-white tracking-tight">${item.id}</span>
                                <span class="text-[8px] font-bold uppercase" style="color:var(--text-dim);">${item.user || 'PIC'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black" style="color:var(--accent-gold);">${formatDurasi(diffMs)}</span>
                                <span class="text-[8px] font-bold" style="color:var(--text-dim);">${item.waktu}</span>
                            </div>
                        </td>
                    </tr>
                `;
                }).join('');
                filterTable();
            } catch (err) {}
        }

        // ===== MODE PINJAM / KEMBALI =====
        function setMode(mode) {
            currentMode = mode;
            const btnP = document.getElementById('modePinjam');
            const btnK = document.getElementById('modeKembali');

            if (mode === 'PINJAM') {
                btnP.className = "flex-1 py-3.5 text-[10px] font-black rounded-xl transition-all tab-pinjam-active uppercase tracking-widest";
                btnK.className = "flex-1 py-3.5 text-[10px] font-black rounded-xl transition-all tab-inactive uppercase tracking-widest";
                btnK.removeAttribute('style');
            } else {
                btnK.className = "flex-1 py-3.5 text-[10px] font-black rounded-xl transition-all tab-kembali-active uppercase tracking-widest";
                btnP.className = "flex-1 py-3.5 text-[10px] font-black rounded-xl transition-all tab-inactive uppercase tracking-widest";
                btnP.removeAttribute('style');
            }
        }

        window.onload = syncData;
        setInterval(syncData, 30000);
    </script>
</body>
</html>
