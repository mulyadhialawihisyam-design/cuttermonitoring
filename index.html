<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutter Tracker Premium | Muly@.ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a; 
            color: #d4af37; 
            -webkit-tap-highlight-color: transparent;
        }
        .luxury-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #f2d479 100%);
            color: #000;
        }
        #reader {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid #d4af37;
        }
        #reader__dashboard_section_csr button { display: none !important; }
        #reader video { object-fit: cover !important; }
        
        .tab-active {
            background-color: #d4af37;
            color: #000;
        }
        .tab-inactive {
            color: #737373;
            border: 1px solid #262626;
        }
        /* Refined Gold Gradient */
        .gold-text-static {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-md mx-auto p-5 space-y-6">
        
        <header class="flex justify-end items-center py-2">
            <div class="flex items-center space-x-2 bg-neutral-900 px-3 py-1.5 rounded-full border border-neutral-800">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black text-white uppercase tracking-tighter">System Secured</span>
            </div>
        </header>

        <div id="cameraContainer" class="hidden">
            <div class="luxury-card p-3 border-2 border-[#d4af37]">
                <div id="reader"></div>
                <button onclick="stopCamera()" class="w-full mt-3 py-3 text-red-500 font-bold text-[10px] uppercase tracking-widest">
                    Batalkan Pemindaian
                </button>
            </div>
        </div>

        <div id="formSection" class="luxury-card p-6 space-y-6">
            <div class="flex space-x-2">
                <button id="modePinjam" onclick="setMode('PINJAM')" class="flex-1 py-3 text-[10px] font-black rounded-xl transition-all tab-active uppercase">PINJAM</button>
                <button id="modeKembali" onclick="setMode('KEMBALI')" class="flex-1 py-3 text-[10px] font-black rounded-xl transition-all tab-inactive uppercase">KEMBALI</button>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-neutral-500 uppercase tracking-[0.2em] ml-1">Asset Identity</label>
                    <div class="relative flex items-center">
                        <input type="text" id="assetIdInput" readonly 
                               class="w-full bg-neutral-900 border border-neutral-800 p-4 pr-14 rounded-2xl font-bold text-white text-xs outline-none focus:border-[#d4af37]" 
                               placeholder="Scan QR Unit...">
                        <button onclick="startCamera()" class="absolute right-2 p-2.5 btn-gold rounded-xl shadow-lg active:scale-90 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button id="submitBtn" onclick="submitData()" 
                        class="w-full py-4 btn-gold font-black text-xs rounded-2xl tracking-[0.1em] uppercase shadow-xl shadow-yellow-900/10 active:scale-95 transition">
                    Simpan ke Cloud Database
                </button>
            </div>
        </div>

        <div class="luxury-card overflow-hidden">
            <div class="px-6 py-5 border-b border-neutral-800 bg-neutral-900/50 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[10px] font-black text-neutral-400 uppercase tracking-widest">Live Monitoring</h3>
                    <span id="outBadge" class="bg-yellow-950/30 text-[#d4af37] text-[9px] font-black px-3 py-1 rounded-md border border-yellow-900/50">0 UNIT OUT</span>
                </div>
                <div class="relative">
                    <input type="text" id="searchInput" onkeyup="filterTable()" 
                           placeholder="Cari Asset atau Karyawan..." 
                           class="w-full bg-black border border-neutral-800 px-4 py-3 rounded-xl text-[10px] font-semibold text-white outline-none focus:border-[#d4af37]">
                </div>
            </div>
            
            <div class="max-h-[350px] overflow-y-auto custom-scroll">
                <table id="mainTable" class="w-full text-left">
                    <thead class="bg-neutral-900 text-[8px] font-black text-neutral-500 uppercase">
                        <tr>
                            <th class="px-6 py-3">ID Asset / PIC</th>
                            <th class="px-6 py-3 text-right">Durasi Pinjam</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-neutral-800">
                        </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-12 mb-8 px-4">
            <div class="border-t border-neutral-900 pt-8 flex flex-col items-center space-y-4">
                
                <div class="text-center space-y-1">
                    <span class="gold-text-static text-lg font-black tracking-tight uppercase">Muly@.ID</span>
                    <p class="text-[7px] font-bold text-neutral-600 uppercase tracking-[0.4em]">Powered By Muly@.ID</p>
                </div>
                
                <a href="https://wa.me/62895340174853" target="_blank" 
                   class="flex items-center space-x-2 bg-neutral-900/50 border border-neutral-800 px-5 py-2 rounded-xl hover:bg-neutral-800 transition">
                    <div class="bg-green-600 p-1 rounded-md">
                        <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </div>
                    <span class="text-[9px] font-bold text-neutral-400 tracking-wider">Hubungi Developer</span>
                </a>

                <p class="text-[7px] font-medium text-neutral-700 tracking-widest uppercase">&copy; 2026 Logistics Ops System</p>
            </div>
        </footer>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxERurz5XLHHI630eGb7ixMkulJ3lFMk0kOxRNlBTJu2FHBmGqmFMlljmo-0scqq88B/exec";
        let currentMode = "PINJAM";
        let html5QrCode = null;

        // FUNGSI SEARCH (No reduction)
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const tr = document.getElementById("mainTable").getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    tr[i].style.display = (td.textContent || td.innerText).toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        // FUNGSI KAMERA (No reduction - Focus & Haptic preserved)
        async function startCamera() {
            const container = document.getElementById('cameraContainer');
            container.classList.remove('hidden');
            if (html5QrCode) { try { await html5QrCode.clear(); } catch(e) {} }
            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 25, qrbox: 250 }, (txt) => {
                    document.getElementById('assetIdInput').value = txt.toUpperCase().trim();
                    if (navigator.vibrate) navigator.vibrate(70);
                    stopCamera();
                });
            } catch (err) { stopCamera(); }
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { document.getElementById('cameraContainer').classList.add('hidden'); });
            }
        }

        // FUNGSI SUBMIT (No reduction - Sync delay preserved)
        async function submitData() {
            const assetId = document.getElementById('assetIdInput').value;
            const btn = document.getElementById('submitBtn');
            if (!assetId) return alert("Scan Asset Terlebih Dahulu!");
            btn.disabled = true;
            btn.innerText = "SINKRONISASI CLOUD...";
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ assetId: assetId, statusAksi: currentMode }) });
                document.getElementById('assetIdInput').value = "";
                setTimeout(syncData, 1500);
            } catch (err) { alert("Gagal Menghubungkan ke Server."); }
            finally { btn.disabled = false; btn.innerText = "SIMPAN KE CLOUD DATABASE"; }
        }

        // FUNGSI SYNC & SORT (No reduction - Terlama di atas preserved)
        async function syncData() {
            const tbody = document.getElementById('dataTableBody');
            try {
                const response = await fetch(SCRIPT_URL + "?action=getdata");
                const res = await response.json();
                document.getElementById('outBadge').innerText = `${res.stats.out} UNIT OUT`;

                if (!res.listDipinjam || res.listDipinjam.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="2" class="px-6 py-12 text-center text-neutral-600 text-[10px] font-black uppercase tracking-widest italic">Inventory Safe / Rak Terisi</td></tr>`;
                    return;
                }

                // Logika Pengurutan: Tanggal & Jam Terlama di Atas
                const sortedData = res.listDipinjam.sort((a, b) => {
                    const dateA = new Date(a.waktu.replace(/(\d{2})\/(\d{2})\/(\d{4})/, '$3-$2-$1'));
                    const dateB = new Date(b.waktu.replace(/(\d{2})\/(\d{2})\/(\d{4})/, '$3-$2-$1'));
                    return dateA - dateB;
                });

                tbody.innerHTML = sortedData.map(item => `
                    <tr class="hover:bg-neutral-900 transition border-neutral-800">
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="text-[11px] font-black text-white tracking-tight">${item.id}</span>
                                <span class="text-[8px] font-bold text-neutral-500 uppercase tracking-tighter">${item.user || 'PIC_FIELD'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-[#d4af37]">${item.waktu.split(' ')[1]}</span>
                                <span class="text-[8px] font-bold text-neutral-600">${item.waktu.split(' ')[0]}</span>
                            </div>
                        </td>
                    </tr>
                `).join('');
                filterTable();
            } catch (err) { }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnP = document.getElementById('modePinjam');
            const btnK = document.getElementById('modeKembali');
            if (mode === 'PINJAM') {
                btnP.className = "flex-1 py-3 text-[10px] font-black rounded-xl transition-all tab-active uppercase";
                btnK.className = "flex-1 py-3 text-[10px] font-black rounded-xl transition-all tab-inactive uppercase";
            } else {
                btnK.className = "flex-1 py-3 text-[10px] font-black rounded-xl transition-all bg-green-600 text-white uppercase shadow-lg shadow-green-900/20";
                btnP.className = "flex-1 py-3 text-[10px] font-black rounded-xl transition-all tab-inactive uppercase";
            }
        }

        window.onload = syncData;
        setInterval(syncData, 30000); // Auto-refresh 30 detik
    </script>
</body>
</html>
